AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  portfolio-hosting - Static website hosting for the portfolio site
  (ACM / S3 / CloudFront with OAC / CloudFront Functions / Route 53).

Parameters:
  DomainName:
    Type: String
    Description: サイトのドメイン（www なし。例：example.com）
    AllowedPattern: "^(?!www\\.)([a-z0-9-]+\\.)+[a-z]{2,}$"
    ConstraintDescription: www を付けない小文字のドメイン名を指定する

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: DomainName のパブリックホストゾーン ID（手動で作成したもの）

Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: CloudFront 用の ACM 証明書は us-east-1 にしか作れないため、このスタックは us-east-1 に作成する

Mappings:
  CloudFront:
    Constants:
      # CloudFront のエイリアスレコードで指定する固定のホストゾーン ID（全ディストリビューション共通）
      HostedZoneId: Z2FDTNDATAQYW2
      # マネージドポリシー：CachingOptimized
      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
      # マネージドポリシー：SecurityHeadersPolicy（HSTS・X-Content-Type-Options・X-Frame-Options・Referrer-Policy など）
      ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

Resources:
  # ============================================================
  # 01. 証明書（ACM）
  #     DNS 検証用のレコードは、HostedZoneId を渡すことで CloudFormation が自動で作る
  # ============================================================
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${DomainName}"
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: portfolio

  # ============================================================
  # 02. コンテンツ置き場（S3）
  #     公開アクセスはすべてブロックし、CloudFront（OAC）からの読み取りのみ許可する
  #     静的ウェブサイトホスティング機能は OAC と併用できないため使わない
  # ============================================================
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: portfolio

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ============================================================
  # 03. CloudFront
  # ============================================================
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Allow CloudFront to read the site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www 付きのアクセスを www なしへ 301 リダイレクトする（パスとクエリ文字列は引き継ぐ）
  # サイトに読み込む JS ではなく、CloudFront のエッジで動く関数
  WwwRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-www-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect www to the apex domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';

          if (host.indexOf('www.') !== 0) {
            return request;
          }

          var params = [];
          var qs = request.querystring;
          for (var key in qs) {
            if (qs[key].multiValue) {
              qs[key].multiValue.forEach(function (v) { params.push(key + '=' + v.value); });
            } else {
              params.push(key + '=' + qs[key].value);
            }
          }

          var location = 'https://${DomainName}' + request.uri;
          if (params.length > 0) {
            location += '?' + params.join('&');
          }

          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } }
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${DomainName} portfolio site"
        Enabled: true
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # 日本のエッジを含む最小の料金クラス（PriceClass_100 は北米・欧州のみ）
        PriceClass: PriceClass_200
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              # OAC を使うため OAI は空にする
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: !FindInMap [CloudFront, Constants, CachePolicyId]
          ResponseHeadersPolicyId: !FindInMap [CloudFront, Constants, ResponseHeadersPolicyId]
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WwwRedirectFunction.FunctionARN
        # OAC で ListBucket を許可していないため、存在しないパスは S3 から 403 で返る。
        # 403・404 とも 404 ページに揃え、ステータスは 404 で返す。
        # ページを後から追加したときに 404 が残り続けないよう、エラーのキャッシュは短くする
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /html/404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /html/404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: Project
          Value: portfolio

  # ============================================================
  # 04. DNS（Route 53）
  #     www なし・www 付きのそれぞれに A / AAAA のエイリアスレコードを作る
  # ============================================================
  ApexRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Constants, HostedZoneId]

  ApexRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Constants, HostedZoneId]

  WwwRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Constants, HostedZoneId]

  WwwRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: !FindInMap [CloudFront, Constants, HostedZoneId]

Outputs:
  BucketName:
    Description: サイトのファイルのアップロード先
    Value: !Ref SiteBucket

  DistributionId:
    Description: キャッシュ削除（無効化）の対象
    Value: !Ref Distribution

  SiteUrl:
    Description: 動作確認用の URL
    Value: !Sub "https://${DomainName}/"
